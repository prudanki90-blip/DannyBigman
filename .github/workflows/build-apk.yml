
name: Build SOAP LAB Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Build APK
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          elif [ -f ./gradlew.bat ]; then
            echo "Found Windows Gradle wrapper; Android build needs a Linux-compatible gradlew."
            exit 1
          else
            echo "No Gradle wrapper found in repository root."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: soap-lab-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
  
